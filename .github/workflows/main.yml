name: HACS Validation
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: node --check Laundry-Monitor-Card.js
      - name: Smoke-load card and validate editor groups
        run: |
          node -e 'global.HTMLElement=class {}; global.customElements={get:()=>undefined,define:()=>{}}; global.window={}; require("./Laundry-Monitor-Card.js")'
      - name: Check trailing whitespace
        run: |
          if grep -nP '[ \t]+$' Laundry-Monitor-Card.js README.md hacs.json .github/workflows/main.yml; then
            echo "Trailing whitespace found"
            exit 1
          fi
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@22.5.0
        with:
          category: plugin
          github_token: ${{ secrets.GITHUB_TOKEN }}

